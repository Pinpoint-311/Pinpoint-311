name: Build and Publish Docker Images

# A release is a pushed v* tag. Nothing is pushed to the registry, and nothing
# is signed, until the same commit has passed the backend tests, the frontend
# checks and the Trivy gate in this run. An unsigned image cannot be deployed
# (the orchestrator and the host updater both refuse it), so a red gate means no
# release rather than a release with a warning.
#
# Every third-party action is pinned to a full commit SHA, with the release it
# corresponds to in the trailing comment. A tag can be moved after review; a
# SHA cannot. Bump them deliberately (Dependabot's github-actions ecosystem
# understands this format).
#
# See docs/RELEASES.md for cutting a release and verifying what it produced.

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/pinpoint-311

jobs:
  # ---------------------------------------------------------------- gate ----
  backend-tests:
    uses: ./.github/workflows/backend-tests.yml

  frontend-checks:
    uses: ./.github/workflows/frontend-checks.yml

  # Dependencies and lockfiles across the repository. The built images are
  # scanned again in build-and-push, before they are pushed.
  trivy-fs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Trivy filesystem scan (fail on CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: CRITICAL
          # A critical with no fixed version available cannot be acted on, and
          # would block every release until upstream ships one. Fixable ones
          # fail the gate.
          ignore-unfixed: true
          exit-code: '1'
          format: table

  # The orchestrator gates rollouts on version + DB-revision compatibility, and
  # it reads both from the image it is about to deploy rather than from a repo
  # checkout — the label travels with the signed artifact, so what was verified
  # is what runs. Derived once here and passed to both image builds.
  stamp:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.stamp.outputs.version }}
      db_revision: ${{ steps.stamp.outputs.db_revision }}
      min_db_revision: ${{ steps.stamp.outputs.min_db_revision }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      - name: Derive version and migration stamp
        id: stamp
        working-directory: ./backend
        run: |
          set -euo pipefail
          pip install --quiet 'alembic>=1.13'

          # Alembic resolves heads from the script directory alone — no database
          # and no env.py, so this is safe to run in CI.
          read -r HEAD_REV PREV_REV <<<"$(python - <<'PY'
          from alembic.config import Config
          from alembic.script import ScriptDirectory

          script = ScriptDirectory.from_config(Config("alembic.ini"))
          heads = script.get_heads()
          if len(heads) != 1:
              raise SystemExit(
                  f"expected exactly one alembic head, found {heads}. Merge the "
                  "branches before publishing — the orchestrator cannot express a "
                  "compatibility window across divergent heads."
              )
          head = heads[0]
          print(head, script.get_revision(head).down_revision or head)
          PY
          )"

          # Explicit declaration wins; see backend/MIN_DB_REVISION for the rule.
          MIN_REV="$(grep -v '^[[:space:]]*#' MIN_DB_REVISION 2>/dev/null | tr -d '[:space:]' || true)"
          MIN_REV="${MIN_REV:-$PREV_REV}"

          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.0.0-main.${GITHUB_SHA::7}"
          fi

          {
            echo "version=${VERSION}"
            echo "db_revision=${HEAD_REV}"
            echo "min_db_revision=${MIN_REV}"
          } >> "$GITHUB_OUTPUT"

          echo "version=${VERSION} db_revision=${HEAD_REV} min_db_revision=${MIN_REV}"

  # ------------------------------------------------- build, sign, attest ----
  build-and-push:
    needs: [stamp, backend-tests, frontend-checks, trivy-fs]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write
      id-token: write   # keyless cosign signing via the Actions OIDC token

    strategy:
      matrix:
        include:
          - context: ./backend
            image: backend
          - context: ./frontend
            image: frontend

    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/pinpoint-311-${{ matrix.image }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Lower-case the image name
        # GHCR refuses upper case, and repository_owner keeps the org's casing.
        run: echo "IMAGE=${IMAGE,,}" >> "$GITHUB_ENV"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Install cosign
        uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1

      - name: Log in to Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.version=${{ needs.stamp.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.pinpoint311.app.version=${{ needs.stamp.outputs.version }}
            org.pinpoint311.app.git_sha=${{ github.sha }}
            org.pinpoint311.app.db_revision=${{ needs.stamp.outputs.db_revision }}
            org.pinpoint311.app.min_db_revision=${{ needs.stamp.outputs.min_db_revision }}

      # The same stamp as build args: the Dockerfiles write them as labels too
      # (so a local build carries them) and the backend exports them as the
      # environment variables /api/health/quick reports.
      - name: Assemble build args
        id: args
        run: |
          {
            echo "build_args<<EOF"
            echo "PINPOINT_VERSION=${{ needs.stamp.outputs.version }}"
            echo "GIT_SHA=${{ github.sha }}"
            echo "DB_REVISION=${{ needs.stamp.outputs.db_revision }}"
            echo "MIN_DB_REVISION=${{ needs.stamp.outputs.min_db_revision }}"
            echo "EOF"
            if [ "${{ matrix.image }}" = "backend" ]; then
              echo "build_contexts=deploy-templates=./deploy/templates"
            else
              echo "build_contexts="
            fi
          } >> "$GITHUB_OUTPUT"

      # Image gate: build the amd64 image locally (nothing leaves the runner)
      # and scan it before anything is pushed. Same cache as the real build
      # below, so the multi-arch build reuses these layers.
      - name: Build for scanning (not pushed)
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: ${{ matrix.context }}
          build-contexts: ${{ steps.args.outputs.build_contexts }}
          build-args: ${{ steps.args.outputs.build_args }}
          platforms: linux/amd64
          load: true
          push: false
          tags: pinpoint-scan/${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      - name: Trivy image scan (fail on CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: pinpoint-scan/${{ matrix.image }}:${{ github.sha }}
          scanners: vuln
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table

      # The image must be able to do its job, not just pass a scan. 1.9.0-rc1
      # shipped without gpg and could not encrypt a single backup; this fails
      # the release before anything is pushed or signed.
      - name: Image self-check (backend)
        if: matrix.image == 'backend'
        run: >
          docker run --rm --entrypoint python
          pinpoint-scan/backend:${{ github.sha }} -m app.cli.selfcheck --tools-only

      - name: Build and push
        id: build
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: ${{ matrix.context }}
          build-contexts: ${{ steps.args.outputs.build_contexts }}
          build-args: ${{ steps.args.outputs.build_args }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # SLSA provenance (max: includes the build's full inputs) and an SPDX
          # SBOM, both stored in the registry next to each platform's image.
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      # Sign the immutable digest, never a tag — a tag can be repointed at other
      # content after signing, which would make the signature meaningless. The
      # orchestrator refuses to deploy anything it cannot verify this way.
      - name: Sign image with cosign (keyless)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      # BuildKit's SBOM is an unsigned in-toto attestation in the registry. A
      # cosign attestation binds it to the same keyless identity as the
      # signature, so `cosign verify-attestation --type spdxjson` (what the
      # updater runs when SBOMs are required) can prove who produced it. One
      # attestation per platform, all on the multi-arch digest that is deployed.
      - name: Attest the SBOM (spdx) with cosign
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          for platform in linux/amd64 linux/arm64; do
            out="sbom-${{ matrix.image }}-${platform//\//-}.spdx.json"
            docker buildx imagetools inspect "${IMAGE}@${DIGEST}" \
              --format "{{ json (index .SBOM \"${platform}\").SPDX }}" > "$out"
            test -s "$out" && [ "$(head -c 4 "$out")" != "null" ] || { echo "no SBOM for ${platform}" >&2; exit 1; }
            cosign attest --yes --type spdxjson --predicate "$out" "${IMAGE}@${DIGEST}"
          done

      - name: Record the digest for the release notes
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p digests
          echo "${IMAGE}@${DIGEST}" > "digests/${{ matrix.image }}.digest"

      - name: Upload digest and SBOMs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-${{ matrix.image }}
          path: |
            digests/${{ matrix.image }}.digest
            sbom-${{ matrix.image }}-*.spdx.json
          retention-days: 90

      # Informational: the full CRITICAL+HIGH picture for the Security tab. The
      # blocking check is the CRITICAL gate above.
      - name: Trivy report (CRITICAL, HIGH)
        if: success()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        continue-on-error: true
        with:
          image-ref: '${{ env.IMAGE }}@${{ steps.build.outputs.digest }}'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@ce5e7eeac396d720fe2d802714996c8ce561e311 # v3.39.0
        if: success()
        continue-on-error: true
        with:
          sarif_file: 'trivy-results.sarif'
          category: trivy-${{ matrix.image }}

  # ------------------------------------------------------------ release ----
  release:
    if: github.ref_type == 'tag'
    needs: [stamp, build-and-push]
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the GitHub release
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0   # release-notes.sh needs the previous tag

      - name: Download digests and SBOMs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: release-*
          merge-multiple: true
          path: release

      - name: Write release notes
        env:
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.stamp.outputs.version }}
          DB_REVISION: ${{ needs.stamp.outputs.db_revision }}
          MIN_DB_REVISION: ${{ needs.stamp.outputs.min_db_revision }}
        run: |
          set -euo pipefail
          BACKEND="$(cat release/digests/backend.digest)"
          FRONTEND="$(cat release/digests/frontend.digest)"
          {
            scripts/release-notes.sh "$TAG"
            echo
            echo "## Images"
            echo
            echo "Signed keylessly by this workflow; schema window \`${MIN_DB_REVISION}\` .. \`${DB_REVISION}\`."
            echo "Pin a town to this release with a \`release.lock\` (docs/RELEASES.md):"
            echo
            echo '```dotenv'
            echo "PINPOINT_VERSION=${VERSION}"
            echo "BACKEND_IMAGE=${BACKEND}"
            echo "FRONTEND_IMAGE=${FRONTEND}"
            echo '```'
          } > notes.md
          cat notes.md

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          files=(release/digests/backend.digest release/digests/frontend.digest release/sbom-*.spdx.json)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file notes.md
            gh release upload "$TAG" "${files[@]}" --clobber
          else
            gh release create "$TAG" --verify-tag --title "$TAG" --notes-file notes.md "${files[@]}"
          fi
