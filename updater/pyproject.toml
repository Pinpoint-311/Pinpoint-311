[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pinpoint-updater"
version = "0.2.0"
description = "Host-side updater for self-hosted Pinpoint 311 instances: verified, backed-up, health-checked upgrades by image digest."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27,<1",
    "pyyaml>=6,<7",
    "pydantic>=2.5,<3",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
pinpoint-updater = "pinpoint_updater.cli:main"

[tool.setuptools.packages.find]
include = ["pinpoint_updater*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "e2e: drives real docker compose against a throwaway project (needs PINPOINT_UPDATER_E2E=1)",
]
