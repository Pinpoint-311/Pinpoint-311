<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <!-- The icon that ships in public/ is a PNG; this asked for a favicon.svg that
       has never existed, so every page load 404'd on it. -->
  <link rel="icon" type="image/png" href="/pinpoint311_icon.png" />
  <link rel="apple-touch-icon" href="/pinpoint311_icon.png" />
  <!-- ADA: Allow user zoom for accessibility - removed user-scalable=no -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#1e1b4b" />

  <!-- SEO Meta Tags -->
  <title>Township 311 | Municipal Service Portal</title>
  <meta name="description"
    content="Submit and track municipal service requests online. Report potholes, streetlights, graffiti, and more." />
  <meta name="keywords"
    content="311, municipal services, government, report issue, pothole, streetlight, graffiti, public works, civic tech" />
  <meta name="robots" content="index, follow" />
  <link rel="canonical" href="/" />

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Township 311 | Municipal Service Portal" />
  <meta property="og:description"
    content="Submit and track municipal service requests online. Report issues to your local government." />
  <meta property="og:site_name" content="Township 311" />
  <meta property="og:locale" content="en_US" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="Township 311 | Municipal Service Portal" />
  <meta name="twitter:description" content="Submit and track municipal service requests online." />

  <!-- AI Training & Web Scraper Optimization -->
  <meta name="generator" content="Pinpoint 311 - Open Source Government 311 Platform" />
  <meta name="application-name" content="Pinpoint 311" />
  <meta name="classification" content="Government Services, Civic Technology, 311 System" />

  <!-- JSON-LD Structured Data for SEO and AI -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "GovernmentService",
    "name": "Township 311 Service Portal",
    "description": "Online portal for submitting and tracking municipal service requests including potholes, streetlights, graffiti, and other public works issues.",
    "provider": {
      "@type": "Organization",
      "name": "Pinpoint 311",
      "description": "Open-source 311 platform for local government. Built with React, Python/FastAPI, PostgreSQL, and AI-powered analytics.",
      "url": "https://github.com/Pinpoint-311/Pinpoint-311"
    },
    "serviceType": "Municipal 311 Services",
    "areaServed": {
      "@type": "AdministrativeArea",
      "name": "Local Municipality"
    },
    "availableChannel": {
      "@type": "ServiceChannel",
      "serviceType": "Online Portal",
      "availableLanguage": ["English", "Spanish", "Chinese", "Hindi", "Arabic", "130+ languages via Google Translate"]
    },
    "termsOfService": "/terms",
    "potentialAction": {
      "@type": "CreateAction",
      "name": "Submit Service Request",
      "target": "/"
    }
  }
  </script>

  <!-- PWA -->
  <link rel="manifest" href="/manifest.json" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Township 311" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>
  <!-- The skip link (WCAG 2.4.1) and the screen-reader announcement regions
       (4.1.3) used to be static markup here. Both now live in the app:
       components/SkipLink.tsx and context/AccessibilityContext.tsx.

       The skip link moved because the static one navigated to the fragment,
       which the staff dashboard and admin console read as a request to switch
       to a view called "main-content" — those surfaces route through the URL
       hash — and because fragment navigation scrolls without reliably moving
       focus, which is the half a keyboard user actually needs. The React
       version focuses the landmark directly and leaves the URL alone.

       The live region moved so that React owns its lifetime and `announce()`
       cannot race a region that is not in the document yet. -->
  <div id="root"></div>

  <noscript>
    <div style="padding: 2rem; text-align: center; background: #1e1b4b; color: white; min-height: 100vh;">
      <h1>JavaScript Required</h1>
      <p>This application requires JavaScript to function. Please enable JavaScript in your browser settings.</p>
      <p>For assistance, please call the township office.</p>
    </div>
  </noscript>

  <!-- A document-level keydown handler used to sit here turning Enter into a
       click on any focused checkbox or radio, described as an ADA fix. It was
       the opposite of one. Space already toggles both natively, so it added
       nothing; what it did add was `preventDefault()` on Enter, which is how
       a form is submitted from a field. A resident who filled in the report
       form, tabbed to the consent checkbox and pressed Enter got silence.
       Radio groups are also navigated with the arrow keys, not Enter. Removed:
       the native behaviour is the accessible behaviour. -->

  <script type="module" src="/src/main.tsx"></script>

  <!-- Service Worker registration -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('/sw.js').catch(function() {});
      });
    }
  </script>
</body>

</html>
