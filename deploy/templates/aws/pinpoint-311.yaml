AWSTemplateFormatVersion: '2010-09-09'

# Pinpoint 311 - the AWS resources a town needs, as one stack.
#
# CloudFormation renders this itself. The town sees AWS's own parameter form and,
# if they ask for one, AWS's own change set - an authoritative diff of what will
# be created, produced by Amazon rather than narrated by us. Nothing in this file
# reaches outside their account at deploy time: no URLs to fetch, no scripts to
# run, no callbacks, no telemetry.
#
# IT EMITS NO SECRETS AS OUTPUTS, and it creates none. There is no IAM access key
# in here. The identity below is a ROLE, which is the arrangement Pinpoint
# prefers: attach it to the EC2 instance or ECS task the application runs on and
# it signs in with a token the platform issues minutes at a time and rotates.
# Nothing to paste into Pinpoint, nothing to leak, nothing to expire. If the
# application does not run on AWS compute, this stack is still the right one -
# create an IAM user by hand afterwards and attach the same managed policy.
#
# WHAT IT DOES NOT COVER, and why:
#   * Bedrock model access. Amazon gates each model behind a per-account
#     enablement step in the Bedrock console. The policy here allows invoking
#     models; the enablement is a provider gate and not something a template can
#     press for you.
#   * Email and SMS. SES domain verification needs DNS records only the town can
#     publish, and 10DLC phone registration is carrier paperwork measured in
#     weeks. No template shortens either.
#   * Nothing for Translate or Rekognition beyond permissions - both are API-only
#     services with no resource to create.
#
# HOW PINPOINT AUTHENTICATES, which is what the trust policy below has to match.
# The application asks for credentials in this order and takes the first answer:
#   1. the ECS container credentials endpoint, if AWS_CONTAINER_CREDENTIALS_-
#      RELATIVE_URI is set in its environment - so on ECS, name PinpointRole as
#      the TASK ROLE (not the task EXECUTION role, which is a different field on
#      the same page and will not do);
#   2. the EC2 instance metadata service, IMDSv2 - so on EC2, attach the
#      INSTANCE PROFILE below to the instance.
# Both are covered by the two service principals in the trust policy. IF
# PINPOINT RUNS IN A CONTAINER ON EC2 - which is how it is normally deployed -
# the instance's metadata options must allow it: IMDSv2 with
# HttpPutResponseHopLimit at 2 or more, because the default of 1 is consumed by
# the hop out of the container and the application sees no credentials at all.
# That setting belongs to the instance, which this stack does not create.
#
# THERE IS NO AUDIT TRAIL OF KEY USAGE unless you arrange one. CloudTrail records
# KMS *management* events - who created the key, who changed its policy - in
# every account by default. It does NOT record Encrypt, Decrypt or
# GenerateDataKey, which are data events and are off unless a trail carries an
# event selector for them. This stack creates no trail: a data-event selector is
# charged per event, a busy 311 portal decrypts constantly, and most accounts
# that need one already have it at organisation level. See the README for the
# one command that turns it on, and the cost note beside it.
#
# NETWORK POSTURE. Every service here - KMS, Secrets Manager, Translate,
# Rekognition, Bedrock - is a public AWS API endpoint reached over the internet
# and authenticated with SigV4. None of them has a network boundary this template
# could set, and Pinpoint is often not running inside a VPC at all (the reference
# deployment is on another cloud entirely), so no VPC endpoints are created. What
# limits access is the role and the key policy, not the network.
#
# IF A NAME IS TAKEN, this stack FAILS rather than adopting anything: the KMS
# alias, the role and the instance profile are all named resources, and
# CloudFormation refuses to create one that already exists. Nothing existing is
# modified. Updating THIS stack is fine and idempotent - every logical id is
# fixed and no name is generated - but a second stack alongside it collides, on
# purpose.
#
# TO REMOVE IT: delete the stack. The role, policy, instance profile and alias go
# with it. The KMS key is deliberately retained - see PreventAccidentalKeyDeletion.
# The ALIAS is not retained. Pinpoint is given the key id rather than the alias
# precisely so that deleting the stack cannot make the key unfindable.

Description: >-
  Pinpoint 311 municipal 311 platform: the KMS key that wraps resident personal
  information, and one least-privilege IAM role covering that key, Secrets
  Manager, Translate, Rekognition and Bedrock.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label: { default: Encryption key }
        Parameters: [KeyAlias, PreventAccidentalKeyDeletion]
      - Label: { default: The identity Pinpoint signs in as }
        Parameters: [RoleName, AllowBedrock, AllowRekognition, AllowTranslate, AllowSecretsManager, SecretsPrefix]

Parameters:
  KeyAlias:
    Type: String
    Default: alias/pinpoint-311-pii
    AllowedPattern: '^alias/[a-zA-Z0-9/_-]+$'
    Description: >-
      Alias for the encryption key. The stack fails if this alias already exists,
      which is deliberate - it is what stops a second run quietly creating a
      second key you keep paying for. NOTE ON THE AUDIT TRAIL, because it is
      easily assumed: creating this key does NOT start a record of who used it.
      CloudTrail logs management events for the key everywhere by default, but
      Encrypt, Decrypt and GenerateDataKey are DATA events and are recorded only
      by a trail configured with a data-event selector, which this stack does not
      create and which is charged per event. Without one there is no record of
      key usage to go back to. The README has the command and the cost note.

  PreventAccidentalKeyDeletion:
    Type: String
    Default: 'Yes'
    AllowedValues: ['Yes', 'No']
    Description: >-
      Adds a policy statement denying everyone the ability to schedule this key
      for deletion or disable it. READ THIS BEFORE CHOOSING: a KMS key stops
      working the moment deletion is SCHEDULED, not when the waiting period ends,
      so an accidental deletion breaks every resident record immediately rather
      than in thirty days. An explicit deny beats every allow, including the
      account root. To retire the key deliberately later, an administrator
      removes that statement first - one considered step where there was none.
      Choosing Yes is the recommendation.

  RoleName:
    Type: String
    Default: pinpoint-311-server
    Description: >-
      Name of the IAM role Pinpoint signs in as. THE STACK CREATES THIS ROLE BUT
      CANNOT ATTACH IT - attaching it is the step that makes everything else here
      work, and skipping it is invisible until the first encryption call fails.
      On EC2, attach the instance profile of this name to the instance, and make
      sure the instance allows IMDSv2 with a metadata hop limit of at least 2 or
      Pinpoint (running in a container) will never see the credentials. On ECS,
      name this role as the TASK ROLE - not the task execution role, which is a
      different field. The stack fails if a role of this name already exists.

  AllowTranslate:
    Type: String
    Default: 'Yes'
    AllowedValues: ['Yes', 'No']
    Description: >-
      Permit Amazon Translate, for translating resident reports. Choosing No
      creates a stack that reports success and a Translation card that fails with
      an access-denied error the first time a resident writes in another
      language; nothing before that point says the permission is missing.

  AllowRekognition:
    Type: String
    Default: 'Yes'
    AllowedValues: ['Yes', 'No']
    Description: >-
      Permit Amazon Rekognition face and text detection, for blurring faces and
      licence plates in resident photographs. Plates are found by reading text,
      so both actions are granted together or neither is. Choosing No leaves
      photo screening unable to call anything: the stack still succeeds, and the
      first photograph a resident sends is what discovers it.

  AllowBedrock:
    Type: String
    Default: 'No'
    AllowedValues: ['Yes', 'No']
    Description: >-
      Permit invoking Amazon Bedrock models, which is what AI triage runs on.
      CHOOSE YES IF YOU SELECTED AWS FOR AI TRIAGE IN PINPOINT - leaving it at No
      produces a stack that deploys cleanly and an AI card that can never work,
      with no error until the first report is triaged. Each model still has to be
      enabled for your account in the Bedrock console; this only grants the call.

  AllowSecretsManager:
    Type: String
    Default: 'Yes'
    AllowedValues: ['Yes', 'No']
    Description: >-
      Permit Pinpoint to keep every credential a town enters in AWS Secrets
      Manager rather than in its own database. Choosing No does not fall back
      silently to the database - it makes every credential save fail once Secrets
      Manager is selected as the store.

  SecretsPrefix:
    Type: String
    Default: pinpoint/
    AllowedPattern: '^[A-Za-z0-9/_+=.@-]*$'
    Description: >-
      Name prefix for the secrets Pinpoint creates, and the limit of what the
      role above may read. MUST MATCH the AWS_SECRETS_PREFIX the application uses
      (its default is the default here); a mismatch produces access-denied on
      every credential save and read. This exists so the grant can be scoped: a
      311 portal has no business reading every secret in the account, and
      Secrets Manager permissions written against '*' let it.

  AllowedIpAddress:
    Type: String
    Default: ''
    Description: >-
      Optional. The public IP address Pinpoint calls AWS from. Set it and the role
      may use Translate, Rekognition, Bedrock and Secrets Manager only from that
      address, so a copied role does not work elsewhere. Leave blank to allow any
      address. On EC2 or ECS behind a NAT this is the NAT or Elastic IP, not the
      instance's private address -- find it by running `curl -s ifconfig.me` on
      the server, and use it where that address is fixed.

  MonthlyBudgetUsd:
    Type: Number
    Default: 0
    MinValue: 0
    Description: >-
      Optional. A monthly cost budget in USD for this account, with email alerts
      at 50%, 80% and 100%. 0 creates no budget. AWS does not cap spending, so a
      budget tells you early rather than stopping anything.

  BudgetAlertEmail:
    Type: String
    Default: ''
    Description: Where budget alerts go. Required if a budget amount is set.

Conditions:
  DenyKeyDeletion: !Equals [!Ref PreventAccidentalKeyDeletion, 'Yes']
  UseTranslate: !Equals [!Ref AllowTranslate, 'Yes']
  UseRekognition: !Equals [!Ref AllowRekognition, 'Yes']
  UseBedrock: !Equals [!Ref AllowBedrock, 'Yes']
  UseSecretsManager: !Equals [!Ref AllowSecretsManager, 'Yes']
  RestrictBySourceIp: !Not [!Equals [!Ref AllowedIpAddress, '']]
  CreateBudget: !And
    - !Not [!Equals [!Ref MonthlyBudgetUsd, 0]]
    - !Not [!Equals [!Ref BudgetAlertEmail, '']]

Resources:

  # Retained on stack deletion on purpose. A KMS key cannot be deleted outright -
  # only scheduled, with a waiting period - and deleting a stack should never be
  # the thing that starts a countdown on every resident record in the database.
  PiiKey:
    Type: AWS::KMS::Key
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Description: Pinpoint 311 - wraps the key that encrypts resident personal information
      KeyUsage: ENCRYPT_DECRYPT
      EnableKeyRotation: true
      PendingWindowInDays: 30
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          # Required. A KMS key whose policy locks out the account that owns it
          # cannot be repaired afterwards by anybody, including AWS support.
          - Sid: AccountKeepsAdministrativeControl
            Effect: Allow
            Principal: { AWS: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:root' }
            Action: 'kms:*'
            Resource: '*'
          # Four actions, on this key. Not kms:*, and not on any other key. USE,
          # not administration: no PutKeyPolicy, no ScheduleKeyDeletion, no
          # CreateGrant. Pinpoint can wrap and unwrap; it cannot change who else
          # may, and it cannot take the key away from the account.
          #
          # !GetAtt makes CloudFormation create the role first, which is what it
          # has to do. IAM is eventually consistent even so, and a key policy
          # naming a role created moments earlier can be rejected with
          # "MalformedPolicyDocumentException: Policy contains a statement with
          # one or more invalid principals". That is this, not a wrong template:
          # re-run the stack and it succeeds. The alternative - dropping this
          # statement and granting KMS through the role's IAM policy instead,
          # which the root statement above already permits - would remove the
          # race but also remove the one place a reviewer can read, on the key
          # itself, exactly who may use it. The explicit statement is worth a
          # retry that says what went wrong.
          - Sid: Pinpoint311MayUseTheKey
            Effect: Allow
            Principal: { AWS: !GetAtt PinpointRole.Arn }
            Action:
              - kms:Encrypt
              - kms:Decrypt
              - kms:GenerateDataKey
              - kms:DescribeKey
            Resource: '*'
          - !If
            - DenyKeyDeletion
            - Sid: NobodyMayStartDeletingThisKey
              Effect: Deny
              Principal: '*'
              Action:
                - kms:ScheduleKeyDeletion
                - kms:DisableKey
              Resource: '*'
            - !Ref AWS::NoValue

  PiiKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: !Ref KeyAlias
      TargetKeyId: !Ref PiiKey

  # An assumable role rather than a user with access keys. The two service
  # principals are the two ways Pinpoint ever obtains credentials: ec2 covers the
  # instance profile below, read through IMDSv2; ecs-tasks covers being named as
  # an ECS task role, read through AWS_CONTAINER_CREDENTIALS_RELATIVE_URI. The
  # application probes both, in that order, so whichever the town uses works with
  # no configuration. Nothing else can assume this role - no account, no user, no
  # other service - and there is no external id or cross-account trust here
  # because Pinpoint never assumes it from outside.
  PinpointRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Ref RoleName
      Description: The identity the Pinpoint 311 application signs in to AWS as
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - ec2.amazonaws.com
                - ecs-tasks.amazonaws.com
            Action: sts:AssumeRole

  PinpointInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: !Ref RoleName
      Roles: [!Ref PinpointRole]

  # Everything the application is allowed to do, in one readable document.
  # Nothing here is account-wide except the two API-only services, which have no
  # resources to scope to - Translate and Rekognition are called, not owned.
  PinpointPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: pinpoint-311-application
      Roles: [!Ref PinpointRole]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - !If
            - UseSecretsManager
            # Scoped to the prefix Pinpoint names its own secrets under, so the
            # role cannot read a secret belonging to anything else in the
            # account. The trailing * absorbs the six random characters Secrets
            # Manager appends to every secret ARN. DeleteSecret is here because
            # clearing a credential from a card calls it, and a permission set
            # that can write a secret but not remove it leaves a town unable to
            # take a credential back out.
            - Sid: KeepTownCredentialsInSecretsManager
              Effect: Allow
              Action:
                - secretsmanager:CreateSecret
                - secretsmanager:PutSecretValue
                - secretsmanager:GetSecretValue
                - secretsmanager:DescribeSecret
                - secretsmanager:DeleteSecret
              Resource: !Sub 'arn:${AWS::Partition}:secretsmanager:*:${AWS::AccountId}:secret:${SecretsPrefix}*'
              # Locked to the same address as the paid APIs, and for the same
              # reason as Azure's key vault: a credential store readable from
              # anywhere is one a copied role can drain. This is the statement
              # where a wrong address hurts most -- Pinpoint cannot read its own
              # secrets and the site stops -- which is why the parameter is
              # optional and says so.
              Condition: !If
                - RestrictBySourceIp
                - IpAddress: { 'aws:SourceIp': [!Ref AllowedIpAddress] }
                - !Ref AWS::NoValue
            - !Ref AWS::NoValue
          # ListSecrets takes no resource - AWS rejects a policy that scopes it -
          # so it is granted separately and on its own. It returns names and
          # metadata, never a secret value.
          - !If
            - UseSecretsManager
            - Sid: ListSecretNames
              Effect: Allow
              Action: [secretsmanager:ListSecrets]
              Resource: '*'
            - !Ref AWS::NoValue
          - !If
            - UseTranslate
            - Sid: TranslateResidentReports
              Effect: Allow
              Action: [translate:TranslateText]
              Resource: '*'
              Condition: !If
                - RestrictBySourceIp
                - IpAddress: { 'aws:SourceIp': [!Ref AllowedIpAddress] }
                - !Ref AWS::NoValue
            - !Ref AWS::NoValue
          - !If
            - UseRekognition
            # DetectText as well as DetectFaces: plate detection works by reading
            # text in the image, so omitting it disables plates silently while
            # faces keep working.
            - Sid: BlurFacesAndPlates
              Effect: Allow
              Action: [rekognition:DetectFaces, rekognition:DetectText]
              Resource: '*'
              Condition: !If
                - RestrictBySourceIp
                - IpAddress: { 'aws:SourceIp': [!Ref AllowedIpAddress] }
                - !Ref AWS::NoValue
            - !Ref AWS::NoValue
          - !If
            - UseBedrock
            - Sid: InvokeBedrockModels
              Effect: Allow
              Action: [bedrock:InvokeModel, bedrock:InvokeModelWithResponseStream]
              Resource: '*'
              Condition: !If
                - RestrictBySourceIp
                - IpAddress: { 'aws:SourceIp': [!Ref AllowedIpAddress] }
                - !Ref AWS::NoValue
            - !Ref AWS::NoValue

  # A budget is not a cap -- nothing in AWS caps spend -- but it is the
  # difference between noticing a runaway in a day and noticing it on an
  # invoice. Created only when an amount and an address are both given, because
  # a budget with nowhere to send its alerts is decoration.
  PinpointBudget:
    Type: AWS::Budgets::Budget
    Condition: CreateBudget
    Properties:
      Budget:
        BudgetName: !Sub 'pinpoint-311-${AWS::StackName}'
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit:
          Amount: !Ref MonthlyBudgetUsd
          Unit: USD
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 50
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref BudgetAlertEmail
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 80
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref BudgetAlertEmail
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 100
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref BudgetAlertEmail

Outputs:
  ReadMeFirst:
    Description: What to do with the values below
    Value: >-
      No secret is emitted here, and none was created. Attach the instance
      profile to the server running Pinpoint and it signs in with no credential
      to paste. Then enter only the region and the key id in Pinpoint.

  PinpointBoxAwsRegion:
    Description: 'Pinpoint box: AWS Region'
    Value: !Ref AWS::Region

  PinpointBoxKeyIdOrArn:
    Description: 'Pinpoint box: Key ID or ARN'
    Value: !Ref PiiKey

  KeyArn:
    Description: Full ARN of the encryption key, for your own records
    Value: !GetAtt PiiKey.Arn

  RoleArnToAttach:
    Description: Attach this role to the EC2 instance or ECS task running Pinpoint
    Value: !GetAtt PinpointRole.Arn

  InstanceProfileName:
    Description: Instance profile to attach on EC2
    Value: !Ref PinpointInstanceProfile
